name: Build Android APK

on:
  push:
    branches:
      - dev
      - main
      - 'feat/**'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile & Package Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Debug Keystore if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Executable Gradle Wrapper
        run: |
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        id: find-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ride-go-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Prepare APK for Release
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          cp ${{ steps.find-apk.outputs.apk_path }} ./ride-go-debug.apk

      - name: Publish or Update GitHub Release (Latest)
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ride Go Latest Build"
          body: |
            Automated CI build from commit ${{ github.sha }} on dev branch.
            Download `ride-go-debug.apk` to update your Ride Go app directly.
          draft: false
          prerelease: false
          files: ./ride-go-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
